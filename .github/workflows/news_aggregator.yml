name: 📬 Macro News Aggregator Daily Run

on:
  schedule:
    # 毎日日本時間 6:15（UTC 21:15）に自動稼働
    - cron: '15 21 * * *'
  workflow_dispatch: # 手動でいつでもトリガー可能

jobs:
  run-aggregator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests pandas

      - name: Run News Aggregator Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          python news_aggregator/main.py

      # ★【重要】：更新された news_intelligence.csv をリポジトリに自動コミット・プッシュ
      - name: Commit and Push Database Update
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add news_aggregator/news_intelligence.csv || true
          git commit -m "chore: auto-update news intelligence database [skip ci]" || true
          git push
